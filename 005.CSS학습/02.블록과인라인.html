<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02. 블록과 인라인</title>
    <style>
        /* 타이틀 */
        .title {
            /* 글자중앙 tac */
            text-align: center;
            /* 테두리 bd 5px 보라색 */
            border: 5px dotted #6614ff;
            /* 배경색 bgc 연핑크 */
            background-color: #ff97dc;
        }

        /* 선택자의 별(*)은 '모든'의 의미! */
        .ele *{
            /* 박스모델의 기본속성 디자인주기
            [박스모델이란?]
             모든 html 요소를 박스로 파악하여
             필수 5개의 속성을 셋팅하는 요소모델
             1. width (가로크기)
             2. height (세로크기)
             3. border (테두리)
             4. margin (바깥여백)
             5. padding (안쪽여백) */
        width: 200px;
        height: 150px;
        border: 10px solid #73ffb2;
        margin: 20px;
        padding: 20px;
        }
    </style>
</head>
<body>
    <h1 class="tit">02. 블록과 인라인</h1>

    <h2 class="tit">인라인 요소들</h2>
    <div class="ele">
        <a href="#">나는 a다!</a>
        <img src="./imgs/blogo.png" alt="로고" title="나는 img다!">
        <span>나는 span이다!</span>
        <b>나는 b다!</b>
        <button>
            나는 button이다! 나는 인라인인가?
        </button>
        <i>나는 i다!</i>
        <em>나는 em이다!</em>
        <strong>나는 strong이다!</strong>
    </div>

    <h2 class="tit">블록 요소들</h2> 
    
    <div class="ele">
        <h1>나는 h1이다!</h1>
        <h4 class="bxb">나는 h4다!</h4>
        <div>나는 div다!</div>
        <p>나는 p다!</p>
        <header>나는 header다!</header>
        <blockquote>나는 blockquote다!</blockquote>
    </div>
</body>
</html>
