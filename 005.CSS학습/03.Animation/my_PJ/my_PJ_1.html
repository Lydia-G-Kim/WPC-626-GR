<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>심슨가족소개 애니</title>
    <!-- 심슨 메인 CSS -->
    <link rel="stylesheet" href="./css/simpson.css">
    <!-- 심슨 애니메이션 CSS -->
    <link rel="stylesheet" href="./css/simpson_ani.css">
</head>

<body>
    <h1 class="tit">Heartsping's Character</h1>

    <!-- 전체화면박스 -->

        <!-- 1.하츄핑 -->
        <img src="./images/hearts/hearts_1.png" alt="하츄핑" class="heartsping">

        <!-- 2.문짝 -->
        <img src="./images/hearts/door.png" alt="문짝" class="door">

        <!-- 3.말풍선 -->

        <!-- 4.로미 -->
        <img src="./images/hearts/hearts_romi.png" alt="로미" class="romi">

        <!-- 5.해핑 -->
        <img src="./images/hearts/hearts_2.png" alt="해핑" class="hp">

        <!-- 6.믿어핑 -->
        <img src="./images/hearts/hearts_6.png" alt="믿어핑" class="be">

        <!-- 7.트러핑 -->
        <img src="./images/hearts/hearts_7.png" alt="트러핑" class="tr">

    <!-- TV이미지 -->
    <img src="./images/oldTVnew.png" alt="TV" id="tv">
