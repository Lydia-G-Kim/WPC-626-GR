<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title> JS1. 자바스크립트 기본 + DOM선택법 </title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* 보이는 화면에 채우기 */
      }
      body {
        overflow: hidden;
      }

      .pbox {
        position: absolute;
        top: 0;
        left: 0;
        /* 부모는? window(보이는화면) */
        margin: 0;
        padding: 0;

        width: 500px;
        height: 500px;
        padding-top: 200px;

        /* 글자 */
        line-height: 50px;
        font-size: 30px;
        text-align: center;
        /* 줄바꿈방지 */
        white-space: nowrap;

        border: 4px solid purple;
        /* 보더박스:보더,패딩포함 */
        box-sizing: border-box;
      }

    </style>

<!-- 자바스크립트 코딩구역! -->
 <script>
  // 인터널 JS 코딩구역 //

  // 함수 만들기 ////////
  // 함수형식 -> function 함수명(){코드구역}
  function 김비서나와라(주머니){

    // 1. 함수 호출 확인!
    // console.log('나왔다! 오바!'+주머니);
    console.log('나왔다! 오바!',주머니);

    // 2. 변경대상에 변경 반영하기

    // 반복되는 변경대상을 특정 메모리 공간에 넣기!
        // 봐 여기 = 값
        // -> 이퀄 오른쪽의 값을 여기에 넣는다!(할당한다)
        // var 여기 = 값
    var 피박스 =
    document
    // 클래스 가져오기
        // get 가져와라! Elements 요소들을!
        // By Class Name 클래스명으로!
    .getElementsByClassName('pbox')
    // 클래스는 여러개일 수 있으므로 0부터 시작
    .item(0)

    // 피박스라는 저장공간 주소에 .pbox 요소를 넣음!
    // console.log(값,값,값) -> +기호대신 콤마(,) 사용가능
    console.log('피박스:', 피박스);
    // [ 문자에 대한 매우 중요한 구분! ]
        // 일반적으로 변수라고 하는 메모리 공간 주소는 문자열로 되어있음! 그래서 문자 데이터와 헷갈림!
        // 메모리 공간 주소 이름은 따옴표로 싸지 않는다!
        // 반면, 문자 데이터는 따옴표로 반드시 싼다!

        // 2-1. 배경이미지 넣기
            // css 배경 변경하기
            // style 객체 안에 각종 css 속성이 모두 만들어져 있음!
            피박스.style.background = 'url(./images/kimbs.jpg) no-repeat top/cover'
      
        // 2-2. 글자색 변경
        피박스.style.color = 'pink';

        // 2-3. 글자 그림자 넣기
        피박스.style.texstShadow = '1px 1px 1px red';

        // 2-4. 박스 둥글게 만들기
        피박스.style.borderRadius = '50%';

        // 2-5. 트랜지션 넣기
        피박스.style.transition = '2s';

        // 2-6. 두바퀴 회전하기
        피박스.style.rotate = '2turn';

        // 2-7. 4사분면으로 이동하기 -> top:50%, left:50%
        피박스.style.top = '50%';
        피박스.style.left = '50%';

        // 2.8 트랜스폼으로 중앙 이동하기 -> transform: -50% -50%
        피박스.style.translate = '-50% -50%'

        // body 요소를 메모리 공강 주소에 넣기
        var 바디 = document.body;

        // 2-9. body에 배경색 넣기
        바디.style.backgroundColor = 'pink'
        
        // 2-10. body에 트랜지션 넣기
        바디.style.transition = '5s'

        // 요청 클래스 요소를 메모리 공간 주소에 담는다!
        var 요청 =
        document.getElementsByClassName('요청').item(0);
        // 2-11. 김비서에 요청내용 찍기 -> 주머니 사용
        // innerText 속성은 요소 내부 데이터로 문자열을 넣는 역할
        요청.innerText = 주머니;

        // 2-12. 요청 클래스 요소에 css 한번에 넣기
            // -> cssText속성 : css 설정 값을 한번에 넣는 속성
        요청.style.cssText = `
          position: absolute;
          top: 0;
          right: -30px;
          border: 4px solid #aaff96;
          background-color: #96fdf5;
          padding: 20px;
          rotate: 15deg;
          color: #b529f9;
        `;

  } /////////// 김비서나와라 함수 ///////////
  //////////////////////////////////////////




  ///////////////////////
 </script>

  </head>
  <body>
    <!-- 드라마 소개박스 -->
     <p
     class="pbox"
     title="클릭하시면 김비서가 나옵니다!"
     onclick="
     // onclick 이벤트 속성은 JS와 연결되는 기본 속성이다
     // 이 구역은 JS 코드 구역임!
     // 이벤트 속성은 아래와 같이 구성된다!
     // -> on+이밴트명 예시) onclick, onmouseover, ...
     // 이벤트 속성은 모든 html 요소에 줄 수 있다!


     // 여기는 JS 문법만 적용된다
     // JS 한줄 주석
     // 경고창 띄우기
     //  alert('김비서! 어서 나와!!!');

     // 콘솔찍기
     console.log('클릭했네~!'); 

     // JS는 전체 html의 지도를 가지고 있다
     // 그 지도명은 document이다
     document
     // 가져온 요소들 중 id명으로 된 요소를 선택한다!
        // -> getElementById(아이디명)
     //document하위 요소 선택 시 점(.)을 찍는다!
        // -> get 가져와! Element 요소를! By Id 아이디로!
     .getElementById('name')
     // 하위로 내려갈 때 점(.)
     // innerHTML = 코드
     // JS에서 이퀄(=)은 이퀄 오른쪽의 값이
        // 이퀄 왼쪽으로 들어가는 것을 의미
     // innerHTML은,
        // inner 안쪽에 HTML 태그를 넣는 속성
        // 오른쪽 값을 감싸줄 때 백틱(`)으로 싸고,
        // 내부 속성 값은 홑따옴표로 사용하여
        // 가장 바깥쪽의 쌍따옴표와 충돌을 막는다.
     .innerHTML=`
     <img 
     src='./images/kim.png' 
     alt='김비서가 왜그럴까'>
     `;
    

     // [따옴표규칙]
     // 따옴표 내부에 같은 따옴표를 쓸 수 없다!
        // -> 쌍따옴표 내부에 홑따옴표
        // -> 홑따옴표 내부에 쌍따옴표
        // -> 쌍따옴표나 홑따옴표 내부에 백틱!

     // 나머지 기능은 외부 함수를 호출에서 구현하자!
        // 함수란? 함 해보슈(수)
        // -> 특정 명령문을 호출할 때 실행하는 코드 저장소!
        // 호출은 함수 이름으로 호출한다!
        // 호출 시 소괄호()를 뒤에 사용한다!

        김비서나와라('아이스크림 사와');

     "
     >

      나는 요즘 매일 생각한다! <br>
      도대체 <span id="name"></span>

      <!-- 김비서에 전달된 요청찍기 -->
       <b class="요청"></b>
     </p>
  </body>
</html>
